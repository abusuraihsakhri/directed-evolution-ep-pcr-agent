name: Deploy browser application

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and JavaScript
        env:
          DEPLOYED_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          import urllib.request

          base = os.environ["DEPLOYED_URL"].rstrip("/") + "/"
          for attempt in range(15):
              try:
                  with urllib.request.urlopen(base, timeout=15) as response:
                      html = response.read().decode("utf-8")
                  with urllib.request.urlopen(base + "app.mjs", timeout=15) as response:
                      script = response.read().decode("utf-8")
                  assert '<script type="module" src="./app.mjs"></script>' in html
                  assert "export function calculateRate" in script
                  print("Published HTML and JavaScript verified:", base)
                  break
              except Exception:
                  if attempt == 14:
                      raise
                  time.sleep(4)
          PY
