name: Python and browser tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Verify installation
        run: |
          python -m pip check
          python -m compileall -q agents directed_evolution
          python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"
      - name: Run Python tests
        run: python -m pytest -q
      - name: Run browser-module tests
        run: |
          node --check web/app.mjs
          node --test tests/web.test.mjs
