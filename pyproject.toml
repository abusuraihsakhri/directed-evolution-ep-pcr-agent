[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-evolution-ep-pcr-engine"
version = "2.0.0"
description = "EvoLoop: Error-Prone PCR & Saturation Mutagenesis Planner Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
directed-evolution-ep-pcr-engine = "directed_evolution.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/directed-evolution-ep-pcr-engine"
Repository = "https://github.com/abusuraihsakhri/directed-evolution-ep-pcr-engine.git"
