[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "directed-evolution-ep-pcr-engine"
version = "3.0.0"
description = "Error-prone PCR and directed evolution analysis and simulation tools"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.110,<1", "uvicorn>=0.27,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
directed-evolution-ep-pcr-engine = "directed_evolution.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/directed-evolution-ep-pcr-agent"
Repository = "https://github.com/abusuraihsakhri/directed-evolution-ep-pcr-agent"
